 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
    <link rel="stylesheet" href="./assets/css/style.css">

     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 </head>
 <body> 

     <div class="container">
      <header class="d-flex justify-content-center align-items-center">
            <i class="fa-solid fa-users text-primary fa-2x"></i>
           <h2>
              User Management Dashboard
           </h2>
           
      </header>
       <div class="row mt-5">
         <div class="col-md-6 offset-md-3">
            <div class="card">
               <div class="card-header  bg-warning d-flex justify-content-center align-items-center ">
                  <i class="fa-solid fa-users text-primary fa-2x"></i>
                   <h3 class="text-center">User Card</h3>
               </div>
               <div class="card-body">
                  <form action="" id="userForm">
                     <div class="form-group">
                        <label for="name">User name*</label>
                        <input type="text" class="form-control" id="name">
                     </div>

                     <div class="form-group">
                        <label for="contact">Contact*</label>
                        <input required type="text" class="form-control" id="contact">
                     </div>

                     <div class="form-group">
                        <label for="email">Email*</label>
                        <input required type="text" class="form-control" id="email">
                     </div>
                               
                       <div class="form-group">
                        <label for="userId">User Id*</label>
                        <select  class="form-control" id="userId">
                              <option value="1">1</option>
                              <option value="2">2</option>
                              <option value="3">3</option>
                              <option value="4">4</option>
                              <option value="5">5</option>
                              <option value="6">6</option>
                              <option value="7">7</option>
                              <option value="8">8</option>
                              <option value="9">9</option>
                              <option value="10">10</option>
                        </select>
                     </div>

                     <button class="btn btn-block btn-outline-primary " id="addUser">Add User</button>
                     <button type="button" class="btn btn-block btn-outline-primary d-none" id="updateUser">Update User</button>
                    
                  </form>
               </div>

            </div>
         </div>
       </div>

       <div class="row mt-5">
         <div class="col-md-8">
            <table class="table table-bordered">
               <thead>
                  <tr>
                     <th>Sr.No</th>
                     <th>User name</th>
                     <th>Contact</th>
                     <th>Email</th>
                     <th>Edit</th>
                     <th>Delete</th>
                  </tr>
               </thead>
                <tbody id="userContainer">
                  <!-- <tr>
                     <td></td>
                     <td></td>
                     <td></td>
                     <td></td>
                     <td><i class="fa-solid fa-pen-to-square text-primary fa-2x"></i></td>
                     <td><i class="fa-solid fa-trash text-danger fa-2x"></i></td>
                  </tr> -->
                </tbody>
            </table>
         </div>
       </div>

     </div>
     
      <div class="spinner d-none" id="spinner">
          <div class="spinner-grow" role="status">
            <span class="sr-only">Loading...</span>
          </div>
      </div>


   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
 </body>
 </html>
